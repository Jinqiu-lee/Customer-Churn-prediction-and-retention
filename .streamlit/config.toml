[theme]
primaryColor = "#FF4B4B"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F0F2F6"
textColor = "#262730"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false
port = 8501

[runner]
# Use a stable Python version that all your packages (scikit-learn 1.4.2) support.
# Python 3.11 is a great balance of modern and stable.
python_version = "3.11"
